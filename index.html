<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espelhos Esféricos - Renato</title>
    <style>
        .control-group:first-child {
    grid-column: 1 / -1;
    margin-bottom: 10px; /* Adiciona um espaço extra abaixo dele */
}

        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 950px;
        }

        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .canvas-container {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #fafafa;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: grab;
            width: 100%;
            height: auto;
        }

        canvas:active {
            cursor: grabbing;
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stats-row-numeric {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            text-align: center;
        }

        .stats-row-text {
            width: 100%;
            text-align: center;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: 5px;
        }

        .instructions {
            font-size: 0.85rem;
            color: #6b7280;
            text-align: center;
            margin-top: -5px;
        }
    </style>
</head>
<body>

    <h1>Simulador de Espelhos Esféricos</h1>
    <p class="instructions">Prof. Renato Inácio Matos - renato.matos@ifma.edu.br</p>

    <div class="container">
                <div class="controls">
            <div class="control-group">
                <label for="mirrorType">Tipo de Espelho</label>
                <select id="mirrorType">
                    <option value="concave">Côncavo</option>
                    <option value="convex">Convexo</option>
                </select>
            </div>
            <div class="control-group">
                <label for="focalLength">Distância Focal (f): <span id="focalVal">120</span>mm</label>
                <input type="range" id="focalLength" min="50" max="250" value="120">
            </div>
            <div class="control-group">
                <label for="zoomRange">Zoom: <span id="zoomVal">1.0</span>x</label>
                <input type="range" id="zoomRange" min="0.1" max="2.0" step="0.1" value="1.0">
            </div>
            <!-- NOVOS CONTROLES ABAIXO PARA O CELULAR -->
            <div class="control-group">
                <label for="pRange">Posição do Objeto (p): <span id="pRangeVal">180</span>mm</label>
                <input type="range" id="pRange" min="10" max="1000" step="1" value="180">
            </div>
            <div class="control-group">
                <label for="hoRange">Altura do Objeto (o): <span id="hoRangeVal">60</span>mm</label>
                <input type="range" id="hoRange" min="10" max="100" step="1" value="60">
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="opticsCanvas" width="900" height="450"></canvas>
        </div>

        <div class="stats-grid">
            <!-- Linha superior com dados estritamente numéricos -->
            <div class="stats-row-numeric">
                <div class="stat-box">
                    <div>Posição do Objeto (p)</div>
                    <div class="stat-value" id="statP">0 mm</div>
                </div>
                <div class="stat-box">
                    <div>Posição da Imagem (p')</div>
                    <div class="stat-value" id="statPPrime">0 mm</div>
                </div>
                <div class="stat-box">
                    <div>Altura do Objeto (o)</div>
                    <div class="stat-value" id="statHO">0 mm</div>
                </div>
                <div class="stat-box">
                    <div>Altura da Imagem (i)</div>
                    <div class="stat-value" id="statHI">0 mm</div>
                </div>
                <div class="stat-box">
                    <div>Aumento Linear (A)</div>
                    <div class="stat-value" id="statA">0.00</div>
                </div>
            </div>
            <!-- Linha inferior isolada com a classificação teórica -->
            <div class="stats-row-text">
                <div class="stat-box">
                    <strong>Características da Imagem</strong>
                    <div class="stat-value" id="statType" style="font-size: 1.2rem; margin-top: 8px;">-</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('opticsCanvas');
        const ctx = canvas.getContext('2d');

        // Referências dos Elementos da Interface
        const mirrorTypeSelect = document.getElementById('mirrorType');
        const focalLengthInput = document.getElementById('focalLength');
        const focalValLabel = document.getElementById('focalVal');
        const zoomRangeInput = document.getElementById('zoomRange');
        const zoomValLabel = document.getElementById('zoomVal');
        const pRangeInput = document.getElementById('pRange');
        const pRangeValLabel = document.getElementById('pRangeVal');
        const hoRangeInput = document.getElementById('hoRange');
        const hoRangeValLabel = document.getElementById('hoRangeVal');

        const statP = document.getElementById('statP');
        const statPPrime = document.getElementById('statPPrime');
        const statHO = document.getElementById('statHO');
        const statHI = document.getElementById('statHI');
        const statA = document.getElementById('statA');
        const statType = document.getElementById('statType');

        // Posição geométrica fixa do Vértice (V) no Canvas
        const vertexX = canvas.width * 0.65; 
        const originY = canvas.height * 0.55; 

        // Configuração Inicial do Estado conforme limites operacionais solicitados
        let state = {
            mirrorType: 'concave',
            f: 120,               
            p: 180,        // Posição inicial (Limite: 10 a 1000mm)       
            objHeight: 60, // Altura inicial (Limite: 10 a 100mm)       
            zoom: 1.0,     // Limite: 0.1x a 2.0x
            isDragging: false,
            dragTarget: null      
        };

        // Escuta os Controles da Interface
        mirrorTypeSelect.addEventListener('input', (e) => {
            state.mirrorType = e.target.value;
            update();
        });

        focalLengthInput.addEventListener('input', (e) => {
            state.f = parseInt(e.target.value);
            focalValLabel.textContent = state.f;
            update();
        });

        zoomRangeInput.addEventListener('input', (e) => {
            state.zoom = parseFloat(e.target.value);
            zoomValLabel.textContent = state.zoom.toFixed(1);
            update();
        });
        pRangeInput.addEventListener('input', (e) => {
            state.p = parseInt(e.target.value);
            pRangeValLabel.textContent = state.p;
            update();
        });

        hoRangeInput.addEventListener('input', (e) => {
            state.objHeight = parseInt(e.target.value);
            hoRangeValLabel.textContent = state.objHeight;
            update();
        });

        // Transforma as coordenadas do clique levando em conta a escala de Zoom
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches.clientX : e.clientX;
            const clientY = e.touches ? e.touches.clientY : e.clientY;
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // Intercepta e valida clique nas partes manipuláveis do Objeto
        function handleStart(e) {
            const pos = getMousePos(e);
            
            const objX = vertexX - (state.p * state.zoom); 
            const objY = originY - (state.objHeight * state.zoom);

            if (Math.abs(pos.x - objX) < 25) {
                if (Math.abs(pos.y - objY) < 25) {
                    state.isDragging = true;
                    state.dragTarget = 'height';
                } else if (pos.y > Math.min(originY, objY) && pos.y < Math.max(originY, objY)) {
                    state.isDragging = true;
                    state.dragTarget = 'position';
                }
            }
        }

        // Executa o reposicionamento discreto (1 em 1 mm inteiros) respeitando os limites estritos
        function handleMove(e) {
            if (!state.isDragging) return;
            if (e.cancelable) e.preventDefault();
            const pos = getMousePos(e);

            if (state.dragTarget === 'position') {
                let newP = Math.round((vertexX - pos.x) / state.zoom);
                if (newP < 10) newP = 10;     // Restrição: mínimo de 10mm
                if (newP > 1000) newP = 1000; // Restrição: máximo de 1000mm
                state.p = newP;
           } else if (state.dragTarget === 'height') {
    // Calcula a altura bruta baseada no movimento
    let newHeight = Math.round((originY - pos.y) / state.zoom);
    
    // Força o valor a respeitar os limites estritos de 10mm a 100mm, impedindo inversões negativas
    if (newHeight < 10) newHeight = 10;
    if (newHeight > 100) newHeight = 100;
    
    state.objHeight = newHeight;
}
            // Sincroniza a posição dos sliders visuais caso o arrasto manual ocorra
            pRangeInput.value = state.p;
            pRangeValLabel.textContent = state.p;
            hoRangeInput.value = state.objHeight;
            hoRangeValLabel.textContent = state.objHeight;

            update();
        }

        function handleEnd() {
            state.isDragging = false;
            state.dragTarget = null;
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleEnd);
        // Renderizador e Motor Analítico Óptico com Correções de Traçado e Notação
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const isConcave = state.mirrorType === 'concave';
            const fSigned = isConcave ? state.f : -state.f;
            const p = state.p; 
            const z = state.zoom; 

            // Aplicação da Equação de Gauss e cálculo da Ampliação
            let pPrime = (p * fSigned) / (p - fSigned);
            let A = -pPrime / p;
            let imgHeight = state.objHeight * A;

            // Determinação espacial dos pontos no Canvas baseada no Zoom
            const fX = isConcave ? vertexX - (state.f * z) : vertexX + (state.f * z);
            const cX = isConcave ? vertexX - (2 * state.f * z) : vertexX + (2 * state.f * z);
            
            const objX = vertexX - (p * z);
            const imgX = pPrime > 0 ? vertexX - (pPrime * z) : vertexX + (Math.abs(pPrime) * z);
            const imgY = originY - (imgHeight * z);

            const isInfinite = Math.abs(p - fSigned) < 0.1;

            // 1. Desenhar o Eixo Óptico Principal
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.stroke();

            // Desenhar a curva da superfície esférica refletora
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 4;
            ctx.beginPath();
            
            const baseRadius = 300;
            const arcRadius = baseRadius * z;
            const arcHeight = 150 * z;
            const clampedArcHeight = Math.min(arcHeight, canvas.height * 0.95);
            const arcAngle = Math.asin(clampedArcHeight / arcRadius);

            if (isConcave) {
                ctx.arc(vertexX - arcRadius, originY, arcRadius, -arcAngle, arcAngle, false);
            } else {
                ctx.arc(vertexX + arcRadius, originY, arcRadius, Math.PI - arcAngle, Math.PI + arcAngle, false);
            }
            ctx.stroke();

            // Desenhar as hachuras do lado oposto ao espelho
            ctx.strokeStyle = '#d1d5db';
            ctx.lineWidth = 1.5;
            const limitY = Math.min(150 * z, canvas.height * 0.48);
            for (let y = originY - limitY; y <= originY + limitY; y += 12) {
                ctx.beginPath();
                if (isConcave) {
                    ctx.moveTo(vertexX, y);
                    ctx.lineTo(vertexX + 8, y - 4);
                } else {
                    ctx.moveTo(vertexX, y);
                    ctx.lineTo(vertexX - 8, y - 4);
                }
                ctx.stroke();
            }

            // Marcadores textuais dos pontos focais no eixo X
            ctx.fillStyle = '#1f2937';
            ctx.font = 'bold 12px sans-serif';
            
            ctx.beginPath(); ctx.arc(vertexX, originY, 4, 0, 2 * Math.PI); ctx.fill();
            ctx.fillText("V", vertexX + (isConcave ? 8 : -16), originY + 20);

            ctx.beginPath(); ctx.arc(fX, originY, 4, 0, 2 * Math.PI); ctx.fill();
            ctx.fillText("F", fX - 4, originY + 20);

            ctx.beginPath(); ctx.arc(cX, originY, 4, 0, 2 * Math.PI); ctx.fill();
            ctx.fillText("C", cX - 4, originY + 20);

            // 2. Traçado dos Raios Luminosos e Prolongamentos Tracejados
            ctx.lineWidth = 1.5;
            if (isInfinite) {
                // --- RAIO 1 NO INFINITO (Vermelho) ---
                ctx.strokeStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(objX, originY - (state.objHeight * z));
                ctx.lineTo(vertexX, originY - (state.objHeight * z));
                ctx.stroke();

                // Reflexão na zona real (esquerda do espelho)
                ctx.beginPath();
                ctx.moveTo(vertexX, originY - (state.objHeight * z));
                let dx1 = fX - vertexX;
                let dy1 = state.objHeight * z;
                ctx.lineTo(vertexX + dx1 * 5, originY - (state.objHeight * z) + dy1 * 5);
                ctx.stroke();

                // Prolongamento na zona virtual atrás do espelho (direita) -> TRACEJADO
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(vertexX, originY - (state.objHeight * z));
                ctx.lineTo(vertexX - dx1 * 5, originY - (state.objHeight * z) - dy1 * 5);
                ctx.stroke();
                ctx.setLineDash([]);

                // --- RAIO 2 NO INFINITO (Verde no Vértice) ---
                ctx.strokeStyle = '#10b981';
                ctx.beginPath();
                ctx.moveTo(objX, originY - (state.objHeight * z));
                ctx.lineTo(vertexX, originY);
                ctx.stroke();

                // Reflexão na zona real
                ctx.beginPath();
                ctx.moveTo(vertexX, originY);
                ctx.lineTo(vertexX + dx1 * 5, originY + dy1 * 5);
                ctx.stroke();

                // Prolongamento na zona virtual -> TRACEJADO
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(vertexX, originY);
                ctx.lineTo(vertexX - dx1 * 5, originY - dy1 * 5);
                ctx.stroke();
                ctx.setLineDash([]);

            } else {
                // --- COMPORTAMENTO GAUSSIANO CONVENCIONAL ---
                // Raio Paralelo -> Foco
                ctx.strokeStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(objX, originY - (state.objHeight * z));
                ctx.lineTo(vertexX, originY - (state.objHeight * z));
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(vertexX, originY - (state.objHeight * z));
                if (isConcave) {
                    let t = canvas.width / Math.max(0.1, Math.abs(vertexX - fX));
                    ctx.lineTo(vertexX - (vertexX - fX) * t, (originY - (state.objHeight * z)) + (state.objHeight * z) * t);
                    ctx.stroke();

                    if (pPrime < 0) { 
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.moveTo(vertexX, originY - (state.objHeight * z));
                        ctx.lineTo(imgX, imgY);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                } else { 
                    let t = canvas.width / Math.max(0.1, Math.abs(vertexX - fX));
                    ctx.lineTo(vertexX - (vertexX - fX) * t, (originY - (state.objHeight * z)) + (state.objHeight * z) * t);
                    ctx.stroke();

                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(vertexX, originY - (state.objHeight * z));
                    ctx.lineTo(fX, originY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Raio Vértice -> Reflexão Simétrica
                ctx.strokeStyle = '#10b981';
                ctx.beginPath();
                ctx.moveTo(objX, originY - (state.objHeight * z));
                ctx.lineTo(vertexX, originY);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(vertexX, originY);
                ctx.lineTo(vertexX - (vertexX - objX) * 4, originY + (state.objHeight * z) * 4);
                ctx.stroke();

                if (pPrime < 0 || !isConcave) {
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(vertexX, originY);
                    ctx.lineTo(imgX, imgY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // 3. Desenhar Objeto (Seta Azul)
            drawArrow(objX, originY, objX, originY - (state.objHeight * z), '#3b82f6', 3.5);
            ctx.fillStyle = '#3b82f6';
            ctx.fillText("Objeto (o)", objX - 25, originY - (state.objHeight * z) - 12);

            // 4. Alimentação Numérica e Classificação Didática dos Dados
            statP.textContent = `${Math.round(p)} mm`;
            statHO.textContent = `${Math.round(state.objHeight)} mm`;

            if (isInfinite) {
                ctx.fillStyle = '#7c3aed';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText("Imagem Imprópria (No Infinito)", canvas.width * 0.1, 50);
                
                statPPrime.textContent = "∞";
                statHI.textContent = "∞";
                statA.textContent = "∞";
                statType.textContent = "Imprópria";
            } else {
                if (imgX >= 0 && imgX <= canvas.width && Math.abs(imgY) < canvas.height * 5) {
                    drawArrow(imgX, originY, imgX, imgY, '#7c3aed', 3.5);
                    ctx.fillStyle = '#7c3aed';
                    ctx.fillText("Imagem (i)", imgX - 25, imgY + (imgHeight >= 0 ? -12 : 18));
                }

                statPPrime.textContent = `${Math.round(pPrime)} mm`;
                statHI.textContent = `${Math.round(imgHeight)} mm`;
                statA.textContent = A.toFixed(2);

                let tipo = "";
                tipo += pPrime > 0 ? "Real, " : "Virtual, ";
                tipo += imgHeight * state.objHeight > 0 ? "Direta, " : "Invertida, ";
                
                const absA = Math.abs(A);
                if (absA > 1.02) tipo += "Maior";
                else if (absA < 0.98) tipo += "Menor";
                else tipo += "De mesmo tamanho";

                statType.textContent = tipo;
            }
        }

        // Função geométrica para construção estruturada de setas vetoriais
        function drawArrow(fromx, fromy, tox, toy, color, linewidth) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = linewidth;
            
            ctx.beginPath();
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();
            
            const angle = Math.atan2(toy - fromy, tox - fromx);
            const headLength = 12;
            
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headLength * Math.cos(angle - Math.PI / 6), toy - headLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headLength * Math.cos(angle + Math.PI / 6), toy - headLength * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        update();
    </script>
</body>
</html>
